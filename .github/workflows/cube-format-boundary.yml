name: Format temporary error boundary
on:
  push:
    branches: [feat/cube-flight-memory]
    paths: [.github/workflows/cube-format-boundary.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/platform/src/features/room/CubeErrorBoundary.tsx apps/platform/src/features/room/RoomPage.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/src/features/room
          if ! git diff --cached --quiet; then
            git commit -m "style(cube-flight): format route error boundary"
            git push origin HEAD:feat/cube-flight-memory
          fi
