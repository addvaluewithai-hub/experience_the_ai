name: Format final game components
on:
  push:
    branches: [feat/cube-flight-memory]
    paths: [.github/workflows/cube-flight-formatter.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write rooms/cube-flight/world/board.tsx rooms/cube-flight/world/landing.tsx
      - name: Commit formatted components
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rooms/cube-flight/world/board.tsx rooms/cube-flight/world/landing.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(cube-flight): format separated game components"
            git push origin HEAD:feat/cube-flight-memory
          fi
